# RailRoute Optimizer — local development stack.
#
#   docker compose up -d                          # PostgreSQL + Redis only (run apps on the host)
#   docker compose --profile app up -d --build    # + migrations, FastAPI backend, Next.js frontend
#
# Values come from the untracked root .env (see .env.example). Ports bind to 127.0.0.1 only.
# If PostgreSQL/Redis already run natively on this machine, set POSTGRES_HOST_PORT / REDIS_HOST_PORT
# (and the ports in DATABASE_URL / REDIS_URL) to free ports, e.g. 55432 / 56379.
name: railroute

services:
  postgres:
    image: postgres:18-alpine
    container_name: railroute-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:?set POSTGRES_ADMIN_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?set POSTGRES_ADMIN_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      # Consumed by infrastructure/postgres/initdb/01-create-app-role.sh on first start.
      POSTGRES_APP_USER: ${POSTGRES_APP_USER:?set POSTGRES_APP_USER in .env}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./infrastructure/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ADMIN_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:8-alpine
    container_name: railroute-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  migrate:
    profiles: ["app"]
    build: ./backend
    image: railroute-backend:local
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MIGRATION_DATABASE_URL: postgresql+psycopg://${POSTGRES_ADMIN_USER}:${POSTGRES_ADMIN_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    profiles: ["app"]
    image: railroute-backend:local
    container_name: railroute-backend
    restart: unless-stopped
    # Configuration parity with `make backend` (docs/08 D-30): every application setting is passed
    # through by name. An entry without a value takes the value from the root .env (or the shell);
    # if it is set in neither, the variable is absent and the default in backend/app/core/config.py
    # applies — exactly as when the backend runs on the host. Defaults are never repeated here.
    # Only container-specific values are set explicitly. Admin database credentials
    # (POSTGRES_ADMIN_*, MIGRATION_DATABASE_URL) are deliberately NOT passed to the runtime.
    # backend/tests/unit/core/test_compose_parity.py fails if a setting is missing from this list.
    environment:
      # --- Container-specific (override any host value from .env) ---------------------------
      DATABASE_URL: postgresql+psycopg://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      # The backend is only reached through the Next.js proxy, which forwards the client address
      # in X-Forwarded-For. Production: put a load balancer that sets X-Forwarded-For in front and
      # never expose the backend directly (see docs/10_OPERATIONS_RUNBOOK.md).
      TRUSTED_PROXY_HOPS: ${COMPOSE_TRUSTED_PROXY_HOPS:-1}
      # --- Application ----------------------------------------------------------------------
      APP_NAME:
      ENVIRONMENT:
      LOG_LEVEL:
      LOG_JSON:
      CORS_ALLOWED_ORIGINS:
      MAX_REQUEST_BODY_BYTES:
      # --- Railway provider (the API key stays server-side) ----------------------------------
      RAILWAY_PROVIDER:
      RAILKIT_API_KEY:
      RAILKIT_BASE_URL:
      RAILKIT_CONNECT_TIMEOUT_SECONDS:
      RAILKIT_READ_TIMEOUT_SECONDS:
      RAILKIT_WRITE_TIMEOUT_SECONDS:
      RAILKIT_POOL_TIMEOUT_SECONDS:
      RAILKIT_MAX_RETRIES:
      RAILKIT_RETRY_BACKOFF_SECONDS:
      RAILKIT_MAX_CONCURRENCY:
      RAILKIT_FARE_CURRENCY:
      RAILKIT_SUPPORTED_QUOTAS:
      # --- Daily IRCTC maintenance window -----------------------------------------------------
      RAILWAY_MAINTENANCE_ENABLED:
      RAILWAY_MAINTENANCE_START:
      RAILWAY_MAINTENANCE_END:
      # --- Tatkal booking window ------------------------------------------------------------
      TATKAL_OPENING_DAYS_BEFORE:
      TATKAL_AC_OPENING_TIME:
      TATKAL_NON_AC_OPENING_TIME:
      # --- Provider quota guard -------------------------------------------------------------
      PROVIDER_WINDOW_REQUEST_LIMIT:
      PROVIDER_WINDOW_SECONDS:
      PROVIDER_MONTHLY_REQUEST_LIMIT:
      PROVIDER_RATE_LIMIT_BACKOFF_SECONDS:
      # --- Search policy --------------------------------------------------------------------
      SUPPORTED_CLASSES:
      MAX_SEGMENTS:
      SEARCH_MAX_TRAINS:
      SEARCH_MAX_CLASSES:
      SEARCH_MAX_AVAILABILITY_REQUESTS:
      SEARCH_DEADLINE_SECONDS:
      PLANNER_MAX_INTERMEDIATE_STOPS:
      MAX_RECOMMENDATIONS:
      MAX_PATHS_PER_COMBINATION:
      AVAILABILITY_DATE_POLICY:
      MAX_ADVANCE_BOOKING_DAYS:
      SEARCH_EXECUTION_MODE:
      MAX_CONCURRENT_SEARCHES:
      SEARCH_SHUTDOWN_GRACE_SECONDS:
      # --- Cache TTLs -----------------------------------------------------------------------
      AVAILABILITY_CACHE_TTL_SECONDS:
      TRAIN_SEARCH_CACHE_TTL_SECONDS:
      TRAIN_ROUTE_CACHE_TTL_SECONDS:
      STATION_SEARCH_CACHE_TTL_SECONDS:
      SINGLE_FLIGHT_LOCK_TTL_SECONDS:
      STALE_AFTER_SECONDS:
      STATION_SEARCH_MIN_QUERY_LENGTH:
      # --- Database pool ----------------------------------------------------------------------
      DATABASE_POOL_SIZE:
      DATABASE_MAX_OVERFLOW:
      DATABASE_ECHO:
      # --- Public API rate limits -----------------------------------------------------------
      API_RATE_LIMIT_WINDOW_SECONDS:
      API_RATE_LIMIT_SEARCH_REQUESTS:
      API_RATE_LIMIT_LOOKUP_REQUESTS:
      # --- Observability and mock provider ----------------------------------------------------
      METRICS_ENABLED:
      METRICS_TOKEN:
      MOCK_LATENCY_MS:
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build: ./frontend/web
    image: railroute-frontend:local
    container_name: railroute-frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
